name: Actualizar Radar UDEM Health
on:
  schedule:
    # 07:00 en Monterrey (UTC-6, sin horario de verano)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-udem-automation
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Recolectar noticias y generar panorama de viernes
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RADAR_URL"
          test -n "$AUTOMATION_TOKEN"
          # Cada invocación consulta una sola fuente, para respetar el límite de subrequests de Workers Free.
          for source in who paho unesco amee aamc funsalud oecd bmc mayo harvard stanford duke mcmaster hopkins mit imperial tec uanl unam udg uc inova stat conversation_health conversation_education nature_news nature_research; do
            echo "Consultando fuente: $source"
            curl --silent --show-error --fail-with-body --retry 1 --max-time 100 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
              "${RADAR_URL%/}/api/automation/run?source=${source}"
            echo
          done
          echo "Actualizando canales de video cuando exista API Key en Cloudflare..."
          for channel in who paho tec harvard nature ted frontiers uchicago; do
            echo "Canal: $channel"
            curl --silent --show-error --max-time 60 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
              "${RADAR_URL%/}/api/automation/run?video=${channel}" || true
            echo
          done
          echo "Comprobando generación del panorama de viernes..."
          curl --silent --show-error --fail-with-body --max-time 150 \
            --request POST \
            --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            "${RADAR_URL%/}/api/automation/run?finalize=1"
