name: Actualizar Radar UDEM Health
on:
  schedule:
    # 07:00 en Monterrey (UTC-6, sin horario de verano)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-udem-automation
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Recolectar noticias y generar panorama de viernes
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RADAR_URL"
          test -n "$AUTOMATION_TOKEN"
          # Cada invocación consulta una sola fuente, para respetar el límite de subrequests de Workers Free.
          for source in who paho unesco amee aamc funsalud oecd bmc mayo harvard stanford duke mcmaster hopkins mit imperial tec uanl unam udg uc inova stat conversation_health conversation_education nature_news nature_research npj_digital_research npj_digital_comment lancet_digital deepmind_ai mittech_ai healthcareit_ai anthropic_ai google_health_ai openai_research_ai openai_applied_ai forbes_health_ai stanford_hai_ai; do
            echo "Consultando fuente: $source"
            curl --silent --show-error --fail-with-body --retry 1 --max-time 100 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
              "${RADAR_URL%/}/api/automation/run?source=${source}"
            echo
            case "$source" in
            nature_news|nature_research|npj_digital_research|npj_digital_comment)
              echo "Esperando antes de consultar la siguiente fuente..."
              sleep 3
              ;;
          esac
          done
          echo "Actualizando canales de video cuando exista API Key en Cloudflare..."
          for channel in who paho tec harvard nature ted frontiers uchicago; do
            echo "Canal: $channel"
            curl --silent --show-error --max-time 60 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
              "${RADAR_URL%/}/api/automation/run?video=${channel}" || true
            echo
          done
          echo "Buscando menciones de directivos para revisión editorial..."
          for leader in tec udem who paho mayo uanl up_medicine up; do
            echo "Líder: $leader"
            curl --silent --show-error --max-time 55 \
              --request POST \
              --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
              "${RADAR_URL%/}/api/automation/run?leader=${leader}" || true
            echo
          done
          echo "Comprobando generación del panorama de viernes..."
          curl --silent --show-error --fail-with-body --max-time 150 \
            --request POST \
            --header "Authorization: Bearer ${AUTOMATION_TOKEN}" \
            "${RADAR_URL%/}/api/automation/run?finalize=1"
